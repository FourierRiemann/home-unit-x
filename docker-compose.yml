# Core:      docker compose up -d
# Optional:  docker compose --profile adblock --profile smarthome --profile torrent --profile games up -d
# Immich and Nextcloud are added in Phase 7 (they need their own databases).

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"
    environment:
      - TZ=${TZ}
    ports:
      - "8096:8096"
      - "7359:7359/udp" # client auto-discovery on the LAN
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${DATA_PATH}/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    profiles: ["adblock"]
    # Port 53 requires disabling the systemd-resolved stub listener first (see build plan, Phase 6)
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp" # first-time setup wizard
      - "8080:80/tcp"
    volumes:
      - ${CONFIG_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${CONFIG_PATH}/adguardhome/conf:/opt/adguardhome/conf
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    profiles: ["smarthome"]
    network_mode: host # needed for device discovery; UI on port 8123
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    # devices:
    #   - /dev/serial/by-id/<your-zigbee-adapter>:/dev/ttyUSB0
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    profiles: ["torrent"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Sweden}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      # Pushes the forwarded port to qBittorrent (needs localhost auth bypass in qBittorrent)
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8081/api/v2/app/setPreferences 2>&1'
    ports:
      - "8081:8081" # qBittorrent web UI; must match WEBUI_PORT or qBittorrent answers "Unauthorized"
    volumes:
      - ${CONFIG_PATH}/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: ["torrent"]
    # All traffic goes through Gluetun; no VPN means no internet (kill switch)
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8081
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${DATA_PATH}/downloads:/downloads
    restart: unless-stopped

  romm:
    image: rommapp/romm:latest
    container_name: romm
    profiles: ["games"]
    depends_on:
      romm-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD:-}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY:-}
      - HASHEOUS_API_ENABLED=true
      # Optional metadata providers (covers, descriptions); leave empty to skip
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER:-}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD:-}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY:-}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
    ports:
      - "8082:8080"
    volumes:
      - ${DATA_PATH}/games:/romm/library # expects games/roms/<platform>/
      - ${CONFIG_PATH}/romm/resources:/romm/resources
      - ${CONFIG_PATH}/romm/assets:/romm/assets # saves and save states
      - ${CONFIG_PATH}/romm/config:/romm/config
      - ${CONFIG_PATH}/romm/redis:/redis-data
    restart: unless-stopped

  romm-db:
    image: mariadb:11
    container_name: romm-db
    profiles: ["games"]
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD:-}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${ROMM_DB_PASSWORD:-}
    volumes:
      - ${CONFIG_PATH}/romm/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
