# Core:      docker compose up -d
# Optional:  docker compose --profile adblock --profile smarthome --profile torrent up -d
# Immich, Nextcloud and RomM are added in Phase 7 (they need their own databases).

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"
    environment:
      - TZ=${TZ}
    ports:
      - "8096:8096"
      - "7359:7359/udp" # client auto-discovery on the LAN
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${DATA_PATH}/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    profiles: ["adblock"]
    # Port 53 requires disabling the systemd-resolved stub listener first (see build plan, Phase 6)
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp" # first-time setup wizard
      - "8080:80/tcp"
    volumes:
      - ${CONFIG_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${CONFIG_PATH}/adguardhome/conf:/opt/adguardhome/conf
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    profiles: ["smarthome"]
    network_mode: host # needed for device discovery; UI on port 8123
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    # devices:
    #   - /dev/serial/by-id/<your-zigbee-adapter>:/dev/ttyUSB0
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    profiles: ["torrent"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Sweden}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      # Pushes the forwarded port to qBittorrent (needs localhost auth bypass in qBittorrent)
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
    ports:
      - "8081:8080" # qBittorrent web UI (8080 on the host is taken by AdGuard Home)
    volumes:
      - ${CONFIG_PATH}/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    profiles: ["torrent"]
    # All traffic goes through Gluetun; no VPN means no internet (kill switch)
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${DATA_PATH}/downloads:/downloads
    restart: unless-stopped
