# Core:      docker compose up -d
# Optional:  docker compose --profile adblock --profile smarthome up -d
# Immich, Nextcloud and RomM are added in Phase 7 (they need their own databases).

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"
    environment:
      - TZ=${TZ}
    ports:
      - "8096:8096"
      - "7359:7359/udp" # client auto-discovery on the LAN
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${DATA_PATH}/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    profiles: ["adblock"]
    # Port 53 requires disabling the systemd-resolved stub listener first (see build plan, Phase 6)
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp" # first-time setup wizard
      - "8080:80/tcp"
    volumes:
      - ${CONFIG_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${CONFIG_PATH}/adguardhome/conf:/opt/adguardhome/conf
    restart: unless-stopped

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    profiles: ["smarthome"]
    network_mode: host # needed for device discovery; UI on port 8123
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    # devices:
    #   - /dev/serial/by-id/<your-zigbee-adapter>:/dev/ttyUSB0
    restart: unless-stopped
